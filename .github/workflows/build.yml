name: Build Bandido Kernel SM-8250

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        device: [x1q, y2q, z3q]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            python3 adb zip curl xz-utils \
            llvm lld dwarves git unzip wget zstd jq ccache

      - name: Download prebuilt Google clang
        run: |
          wget --no-cookies --header "Cookie: gi=0" -O clang-r547379.tar.gz \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r547379.tar.gz
          mkdir clang-r547379; cd clang-r547379
          tar -xf ../clang-r547379.tar.gz
          rm ../clang-r547379.tar.gz
          cd ..

      - name: Build kernel for ${{ matrix.device }}
        run: |
          chmod +x build_sm8250.sh
          ./build_sm8250.sh ${{ matrix.device }} llvm-23.1.3/LLVM-23.1.3-Linux-X64

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: Bandido-${{ matrix.device }}
          path: Bandido-kernel-${{ matrix.device }}-*.zip
