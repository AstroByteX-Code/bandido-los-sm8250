name: Build Bandido Kernel SM-8250

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        device: [x1q, y2q, z3q]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            python3 adb zip curl xz-utils \
            llvm lld dwarves git unzip wget zstd jq ccache

      - name: Download LLVM 23.1.3 toolchain
        run: |
          wget -O llvm.tar.xz "https://release-assets.githubusercontent.com/github-production-release-asset/75821432/df792f26-7468-40a8-96b8-01bc58f4d6eb?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-10-11T17%3A11%3A14Z&rscd=attachment%3B+filename%3DLLVM-23.1.3-Linux-X64.tar.xz&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-10-11T16%3A10%3A37Z&ske=2026-10-11T17%3A11%3A14Z&sks=b&skv=2018-11-09&sig=nfEBVQQzBMMWtpboYDmmNLy4dSoKVCO%2BcsxXzSnuHNs%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc5MTczOTE2NywibmJmIjoxNzkxNzM1NTY3LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.Dra3LFAYwekjEb4BoVAAb_ZLigkJ7LOG600jjay72rU&response-content-disposition=attachment%3B%20filename%3DLLVM-23.1.3-Linux-X64.tar.xz&response-content-type=application%2Foctet-stream"
          mkdir llvm-23.1.3 && cd llvm-23.1.3
          tar -xf ../llvm.tar.xz
          rm ../llvm.tar.xz
          cd ..

      - name: Build kernel for ${{ matrix.device }}
        run: |
          chmod +x build_sm8250.sh
          ./build_sm8250.sh ${{ matrix.device }} llvm-23.1.3/LLVM-23.1.3-Linux-X64

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: Bandido-${{ matrix.device }}
          path: Bandido-kernel-${{ matrix.device }}-*.zip
