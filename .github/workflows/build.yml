name: Build Bandido Kernel SM-8250

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        device: [x1q, y2q, z3q]

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            python3 adb zip curl xz-utils \
            llvm lld dwarves git unzip wget zstd jq ccache

      - name: Download LLVM 23.1.3 toolchain
        run: |
          wget -O llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.xz
          mkdir llvm-23.1.3 && cd llvm-23.1.3
          tar -xf ../llvm.tar.xz
          rm ../llvm.tar.xz
          cd ..


      - name: Build kernel for ${{ matrix.device }}
        run: |
          chmod +x build_sm8250.sh
          ./build_sm8250.sh ${{ matrix.device }} llvm-23.1.3/LLVM-23.1.3-Linux-X64

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: Bandido-${{ matrix.device }}
          path: Bandido-kernel-${{ matrix.device }}-*.zip
