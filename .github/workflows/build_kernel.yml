name: Bandido Kernel Release Build

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Target device codename (x1q, y2q, z3q, c1q, c2q)"
        required: true
        default: "y2q"
      release:
        description: "Upload release"
        type: boolean
        required: true
        default: false
      changelog:
        description: "Changelog"
        type: string
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # 1. Checkout repository with submodules (shallow clone)
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev \
            libncurses5-dev libncursesw5-dev \
            python3 git zip curl jq zstd ccache \
            gcc-aarch64-linux-gnu \
            llvm lld

      - name: Set Timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "Asia/Karachi"

      - name: Record Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
        
      - name: Download prebuilt Google clang
        run: |
          wget --no-cookies --header "Cookie: gi=0" -O clang-r547379.tar.gz \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r547379.tar.gz
          mkdir clang-r547379; cd clang-r547379
          tar -xf ../clang-r547379.tar.gz
          rm ../clang-r547379.tar.gz
          cd ..
          
      - name: Run build_sm8250.sh
        run: |
          chmod +x build_sm8250.sh
          ./build_sm8250.sh "${{ github.event.inputs.device }}" "toolchains/llvm-23.1.0-rc3"

      - name: Record End Time
        run: echo "END_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Calculate Build Duration
        run: |
          duration=$((END_TIME - START_TIME))
          minutes=$((duration / 60))
          seconds=$((duration % 60))
          echo "BUILD_DURATION=${minutes}m ${seconds}s" >> $GITHUB_ENV

      - name: Generate release version
        id: ts
        run: |
          echo "RELEASE_TS=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV
          : > version.txt
          echo "**Kernel version:** $(cat out/include/config/kernel.release)  " >> version.txt
          echo >> version.txt
          export KHASH="$(git rev-parse HEAD)"
          echo "**Kernel source:** [$KHASH](https://github.com/AstroByteX-Code/bandido-los-sm8250/tree/$KHASH)" >> version.txt

          if [ "${{ github.event.inputs.release }}" = "true" ] && \
             [ -n "${{ github.event.inputs.changelog }}" ]; then
            echo >> version.txt
            echo "**Changelog:**" >> version.txt
            echo >> version.txt
            printf "%b\n" "${{ github.event.inputs.changelog }}" >> version.txt
          fi

      - name: Find ZIP File
        run: |
          zip=$(ls Bandido-*.zip 2>/dev/null | head -n1)
          if [ -z "$zip" ]; then
            echo "❌ No ZIP found!"
            exit 1
          fi
          echo "zip_file=$zip" >> $GITHUB_ENV
          echo "DEVICE_NAME=${{ github.event.inputs.device }}" >> $GITHUB_ENV

      # 4. Upload the generated zip file
      - name: Upload release assets
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2.4.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body_path: version.txt
          tag_name: "${{ env.RELEASE_TS }}"
          name: "Bandido-${{ github.event.inputs.device}}-${{ env.RELEASE_TS }}"
          files: ${{ env.zip_file }}
